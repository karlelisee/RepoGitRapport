apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: gc
      service: api
      env: staging
  template:
    metadata:
      labels:
        app: gc
        service: api
        env: staging
    spec:
      containers:
        - name: java
          image: hexagone-api:{{ .Values.image.tag }}
          env:
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: bdd-secret
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://bdd/gc
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: gc
    service: api
    env: staging
  ports:
    - port: 80
      targetPort: 8080
