services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tp-db


  db:
    image: postgres:17
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgsql:/var/lib/postgresql/data
    networks:
      - tp-db


  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dockhand:/app/data
    networks:
      - tp-db


  api:
    build: ./api
    container_name: api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.back.rule=PathPrefix(`/api`)"
      - "traefik.http.services.back.loadbalancer.server.port=8080"
    networks:
      - tp-db


  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SERVER_PORT: 88
      APP_SERVICES_CLIENTS_URL: http://api:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/web`)"
      - "traefik.http.routers.web.middlewares=web-strip"
      - "traefik.http.middlewares.web-strip.stripprefix.prefixes=/web"
      - "traefik.http.services.web.loadbalancer.server.port=88"
    networks:
      - tp-db


networks:
  tp-db:
    name: tp-db