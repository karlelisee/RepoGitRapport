apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
        app: gc
        service: web
        env: staging
  template:
    metadata:
      labels:
        app: gc
        service: web
        env: staging
    spec:
      containers:
      - name: java
        image: hexagone-web:1.0
        env:
          -  name: APP_SERVICES_CLIENTS_URL
             value: http://api
        ports:
        - containerPort: 8080

--- 

apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: gc
    service: web
    env: staging
  ports:
  - port: 80
    targetPort: 8080

---
# https://kubernetes.io/docs/concepts/services-networking/ingress/#the-ingress-resource

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80